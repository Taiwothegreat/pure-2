.toggle-row {
  display: flex;

}

.toggle-switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 20px;
}

.toggle-switch input {
  display: none;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0; 
  left: 0;
  right: 0; 
  bottom: 0;
  background-color: #ccc;
  transition: .4s;
  border-radius: 20px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 14px;
  width: 14px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: .4s;
  border-radius: 50%;
}

.toggle-switch input:checked + .slider {
  background-color: #66bb6a;
}

.toggle-switch input:checked + .slider:before {
  transform: translateX(20px);
}

.buttons {
  margin-top: 20px;
  text-align: right;
  width: 100%;
}

.buttons button {
  margin-left: 10px;
}

<script>

function verifyAge() {
  const dayInput = document.getElementById("day").value.trim();
  const monthInput = document.getElementById("month").value.trim();
  const yearInput = document.getElementById("year").value.trim();

  // ✅ Restrict input lengths (max 2 digits for day/month, 4 digits for year)
  if (dayInput.length > 2 || monthInput.length > 2 || yearInput.length > 4) {
    document.getElementById("errorMsg").style.display = "block";
    document.getElementById("errorMsg").innerText = "Please enter a valid date of birth.";
    return;
  }

  const day = parseInt(dayInput);
  const month = parseInt(monthInput) - 1;
  const year = parseInt(yearInput);

  if (!day || isNaN(day) || !year || isNaN(year) || month < 0 || month > 11) {
    document.getElementById("errorMsg").style.display = "block";
    document.getElementById("errorMsg").innerText = "Please enter a valid date of birth.";
    return;
  }

  const dob = new Date(year, month, day);

  // ✅ Ensure entered values match the constructed date (avoids 35/14 issue)
  if (
    dob.getDate() !== day ||
    dob.getMonth() !== month ||
    dob.getFullYear() !== year
  ) {
    document.getElementById("errorMsg").style.display = "block";
    document.getElementById("errorMsg").innerText = "Please enter a valid date of birth.";
    return;
  }

  const today = new Date();

  // ✅ Reject future dates
  if (dob > today) {
    document.getElementById("errorMsg").style.display = "block";
    document.getElementById("errorMsg").innerText = "Date of birth cannot be in the future.";
    return;
  }

  // ✅ Reject impossible years (too old / unrealistic)
  if (year < 1900) {
    document.getElementById("errorMsg").style.display = "block";
    document.getElementById("errorMsg").innerText = "Please enter a realistic year of birth.";
    return;
  }

  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();

  if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
    age--;
  }

  if (age >= 18) {
    // ✅ Open cookie pop-up in new tab
    //window.open("https://www.purefinestdrinks.com/finest.html", "_blank");

    // ✅ Then allow access to the website
   // window.location.href = "finest.html";
   //NEW LINE
       //window.location.href = "https://www.purefinestdrinks.com/finest.html";
       window.location.href = "finest.html";
  } else {
    document.getElementById("errorMsg").style.display = "block";
    document.getElementById("errorMsg").innerText = "Sorry, you must be 18+ to enter.";
  }
}


// Update EST (Eastern Time, e.g. Delaware USA)
function updateEST() {
  const now = new Date();
  const estTime = now.toLocaleString("en-US", { timeZone: "America/New_York" });
  document.getElementById("estTime").innerText = estTime;
}
setInterval(updateEST, 1000);
updateEST();
</script>
