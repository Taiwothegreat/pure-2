<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags -->
  <title>Your Website Name</title>
  <meta name="description" content="A short description of your website for Google search results.">
  <meta name="author" content="Your Website or Brand Name">

  <!-- Favicon -->
  <link rel="icon" href="https://www.yourwebsite.com/images/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="https://www.yourwebsite.com/images/favicon.ico" type="image/x-icon">

  <!-- Structured Data for Logo -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "url": "https://www.yourwebsite.com",
    "logo": "https://www.yourwebsite.com/images/logo.png",
    "name": "Your Website Name",
    "sameAs": [
      "https://www.facebook.com/yourbrand",
      "https://www.twitter.com/yourbrand",
      "https://www.instagram.com/yourbrand"
    ]
  }
  </script>
</head>
