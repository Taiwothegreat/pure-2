   /* Container with isolation */


.pfi-thumbnail-section,
.pfi-thumbnail-sec {
  width: 100%;
  padding: 50px 20px;
  background-color: #f9f9f9;
  clear: both;
  position: relative;
  z-index: 1;
  margin-left: 200px;
  margin-top: 30px;
  display: flex;
  flex-wrap: wrap;
  gap: 30px; /* space between thumbnails */
  justify-content: center;
}

.pfi-thumbnail-section .thumbnail-box,
.pfi-thumbnail-sec .thumbnail-box {
  width: 100%;
  max-width: 450px; /* ✅ wider thumbnail */
  height: 460px;
   background-color: #f9f9f9;
 /* background: #ffffff;*/
  border: 2px solid brown;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease;
  color: black;
}

.pfi-thumbnail-section .thumbnail-box:hover,
.pfi-thumbnail-sec .thumbnail-box:hover {
  transform: scale(1.02);
}

/* Image inside thumbnail */
.pfi-thumbnail-section img,
.pfi-thumbnail-sec img {
  width: 100%;
  height: auto;
  max-height: 220px;
  object-fit: contain; /* shows full image without cropping */
  border-bottom: 2px solid brown;
  transition: transform 0.4s ease-in-out;
  display: block;
/*  background-color: #fff;*/
    background-color: #afabab !important;
}

.pfi-thumbnail-section .thumbnail-box:hover img,
.pfi-thumbnail-sec .thumbnail-box:hover img {
  transform: scale(1.1);
}

/* Caption content */
.pfi-thumbnail-section .caption,
.pfi-thumbnail-sec .caption {
  flex: 1;
  padding: 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 10px; /* spacing inside caption */
  background-color: #f9f9f9;

}

.pfi-thumbnail-section .caption h2,
.pfi-thumbnail-sec .caption h2 {
  font-size: 18px;
  margin: 0;
  color: black;
  font-weight: bold;
/*  font-family: 'Saira Stencil One', sans-serif !important;*/
      font-family: Cinzel Decorative, serif;
}

.pfi-thumbnail-section .caption p,
.pfi-thumbnail-sec .caption p {
  font-size: 17px;
  color: black;
  line-height: 1.6;
  margin: 0;
}

/* ✅ Mobile responsiveness */
@media (max-width: 768px) {
  .pfi-thumbnail-section,
  .pfi-thumbnail-sec {
    margin-left: 0;
    padding: 30px 10px;
    
  }

  .pfi-thumbnail-section .thumbnail-box,
  .pfi-thumbnail-sec .thumbnail-box {
    max-width: 100%;
    height: auto;
  }

  .pfi-thumbnail-section img,
  .pfi-thumbnail-sec img {
    max-height: 180px;
  }

  .pfi-thumbnail-section .caption,
  .pfi-thumbnail-sec .caption {
    padding: 15px;
  }

  .pfi-thumbnail-section .caption h2,
  .pfi-thumbnail-sec .caption h2 {
    font-size: 16px;
  }

  .pfi-thumbnail-section .caption p,
  .pfi-thumbnail-sec .caption p {
    font-size: 13px;
  }
}

.pfi-layout-container {
  position: relative;
  max-width: 1200px;
  min-height: 700px;
  margin: 100px auto;
  padding: 0 15px;
}

.pfi-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  position: absolute;
  top: 20px;
  width: 100%;
  gap: 400px; /* spacing between thumbnails */
}

.pfi-thumb {
  width: 300px;
  padding: 0 20px 20px 20px; /* no top padding to let image touch top */
 /* background-color: #fff;*/
  background-color: #f9f9f9;

  text-align: center;
  z-index: 1;
  border: 2px solid brown;
  border-radius: 12px;
  color: brown;
  box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  box-sizing: border-box;
  
}
.caption h2{
  font-family: Cinzel Decorative, serif;
}
.pfi-thumb:hover {
  transform: scale(1.03);
  box-shadow: 0 0 20px rgba(165, 42, 42, 0.4);
}

.pfi-thumb img {
  width: calc(100% + 40px); /* to extend image beyond horizontal padding */
  margin-left: -20px;
  margin-right: -20px;
  height: 200px;
  object-fit: cover;
  border-radius: 10px 10px 0 0;
  border-bottom: 1px solid brown;
  display: block;
  margin-top: 0; /* ensure image touches top */
}

.pfi-thumb h3 {
  font-size: 20px;
  font-weight: bold;
  margin: 15px 0 10px;
  color: #000000 !important;
  font-family: Cinzel Decorative, serif;
}

.pfi-thumb p {
  font-size: 16px;
  color: #000000 !important;
}

.pfi-top {
  top: 70%;
}

.pfi-center {
  top: 70%;
  transform: translateY(-50%);
  z-index: 2;
}

.pfi-bottom {
  bottom: 90%;
}

/* Tablet view */
@media (max-width: 991px) {
  .pfi-layout-container {
    min-height: auto;
    margin: 80px auto;
  }

  .pfi-row {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 40px; /* still space between items */
    position: static;
    margin-top: 30px;
  }

  .pfi-thumb {
    width: 45%;
  }
}

/* Mobile view */
@media (max-width: 767px) {
  .pfi-row {
    flex-direction: column;
    align-items: center;
    gap: 30px;
    position: static;
    margin-top: 20px;
  }

  .pfi-thumb {
    width: 90%;
  }
}

@media (max-width: 992px) {
  .pfi-layout-container {
    height: auto;
  }

  .pfi-row {
    position: static;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    margin-bottom: 40px;
  }

  .pfi-center {
    transform: none;
  }

  .pfi-thumb {
    width: 100%;
    max-width: 360px;
  }
}

.carousel-indicators {

  cursor: pointer;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid transparent;
  padding: 3px;
  transition: border-color 0.3s;
}

.carousel-indicators .active {
  border-color: #6ccb35; /* green border for active indicator */
}

.carousel-indicators img {
  width: 40px;
  height: 40px;
  object-fit: cover;
