<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Search Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
  <style>
    body { background: #fff; }
    .form-section { margin-top: 30px; }
    .results-section { margin-top: 30px; }
    .job-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 4px; background: #fff; }
    .job-card h4 { margin-top: 0; }
    #map { width: 100%; height: 400px; margin-top: 20px; border:0; }
    .btn-map { margin-top: 10px; }
  </style>
</head>
<body>
<div class="container">
  <div class="row form-section">
    <!-- Search Form -->
    <div class="col-sm-4">
      <h3>Filter Results</h3>
      <form id="job-search-form">
        <!-- Job Category -->
        <div class="form-group">
          <label for="job-category">Job Category</label>
          <select id="job-category" name="jobCategory[]" class="form-control" multiple="multiple">
            <option></option>
            <option value="Business Services">Business Services</option>
            <option value="Finance">Finance</option>
            <option value="Human Resources">Human Resources</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Marketing">Marketing</option>
            <option value="Supply Chain">Supply Chain</option>
            <option value="Sales">Sales</option>
            <option value="Legal">Legal</option>
          </select>
          <button type="button" class="btn btn-default btn-xs" id="clear-job-category" style="margin-top:5px;">Clear</button>
        </div>

        <!-- Country -->
        <div class="form-group">
          <label for="country">Country</label>
          <select id="country" class="form-control">
            <option></option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="Mexico">Mexico</option>
            <option value="Singapore">Singapore</option>
            <option value="Ireland">Ireland</option>
            <option value="Costa Rica">Costa Rica</option>
            <option value="India">India</option>
            <option value="Argentina">Argentina</option>
            <option value="Chile">Chile</option>
          </select>
        </div>

        <!-- City -->
        <div class="form-group">
          <label for="city">City</label>
          <select id="city" class="form-control">
            <option></option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Search</button>
        <button type="reset" class="btn btn-default btn-block" id="clear-btn">Clear All</button>
      </form>
    </div>

    <!-- Search Results -->
    <div class="col-sm-8 results-section">
      <h3>Search Results</h3>
      <div id="results"></div>
    </div>
  </div>

  <!-- Map -->
  <div class="row">
    <div class="col-sm-12">
      <iframe id="map" src="https://www.google.com/maps?q=World&output=embed"></iframe>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
  // Expanded Country -> Cities
  const countryCities = {
    "USA": [
      "New York, NY", "Los Angeles, CA", "Chicago, IL", "Houston, TX", "Phoenix, AZ",
      "Philadelphia, PA", "San Antonio, TX", "San Diego, CA", "Dallas, TX", "San Jose, CA",
      "Austin, TX", "Jacksonville, FL", "San Francisco, CA", "Columbus, OH", "Charlotte, NC",
      "Indianapolis, IN", "Fort Worth, TX", "Detroit, MI", "Seattle, WA", "Denver, CO"
    ],
    "UK": [
      "London", "Manchester", "Birmingham", "Leeds", "Glasgow", "Liverpool", "Newcastle",
      "Sheffield", "Bristol", "Nottingham", "Leicester", "Edinburgh", "Cardiff", "Belfast",
      "Coventry", "Hull", "Stoke-on-Trent", "Derby", "Southampton", "Portsmouth"
    ],
    "Mexico": ["Ciudad de México"],
    "Singapore": ["Singapore"],
    "Ireland": ["Ballina"],
    "Costa Rica": ["Liberia"],
    "India": ["Ahmedabad"],
    "Argentina": ["Buenos Aires"],
    "Chile": ["San Bernardo"]
  };

  // Job dataset
  const jobs = [
    { title: "Marketing Manager", category: "Marketing", city: "New York, NY", country: "USA" },
    { title: "Software Engineer", category: "Information Technology", city: "San Francisco, CA", country: "USA" },
    { title: "HR Coordinator", category: "Human Resources", city: "Chicago, IL", country: "USA" },
    { title: "Finance Analyst", category: "Finance", city: "Houston, TX", country: "USA" },
    { title: "Warehouse Operator", category: "Supply Chain", city: "Dallas, TX", country: "USA" },
    { title: "Sales Representative", category: "Sales", city: "Los Angeles, CA", country: "USA" },
    { title: "Legal Advisor", category: "Legal", city: "Seattle, WA", country: "USA" },
    { title: "Business Analyst", category: "Business Services", city: "Denver, CO", country: "USA" },
    { title: "Marketing Specialist", category: "Marketing", city: "London", country: "UK" },
    { title: "IT Support Engineer", category: "Information Technology", city: "Manchester", country: "UK" },
    { title: "Finance Associate", category: "Finance", city: "Birmingham", country: "UK" },
    { title: "HR Generalist", category: "Human Resources", city: "Glasgow", country: "UK" },
    { title: "Sales Associate", category: "Sales", city: "Liverpool", country: "UK" },
    { title: "Warehouse Coordinator", category: "Supply Chain", city: "Leeds", country: "UK" },
    { title: "Legal Consultant", category: "Legal", city: "Nottingham", country: "UK" },
    { title: "Business Manager", category: "Business Services", city: "Edinburgh", country: "UK" },
    { title: "Production Operator", category: "Supply Chain", city: "Ciudad de México", country: "Mexico" },
    { title: "Data Scientist", category: "Information Technology", city: "Singapore", country: "Singapore" },
    { title: "Budget Cost Analyst", category: "Finance", city: "Liberia", country: "Costa Rica" },
    { title: "Warehouse Tank Farm Owner", category: "Supply Chain", city: "Ahmedabad", country: "India" }
  ];

  // Initialize Select2
  $(document).ready(function () {
    $("#job-category").select2({ placeholder: "Please Select...", allowClear: true });
    $("#country").select2({ placeholder: "Please Select...", allowClear: true });
    $("#city").select2({ placeholder: "Please Select...", allowClear: true });

    // Populate cities dynamically
    $("#country").on("change", function () {
      const country = $(this).val();
      $("#city").empty().append('<option></option>');
      if (country && countryCities[country]) {
        countryCities[country].forEach(city => {
          $("#city").append(`<option value="${city}">${city}</option>`);
        });
      }
      $("#city").trigger("change");
    });

    // Clear only job categories
    $("#clear-job-category").on("click", function () {
      $("#job-category").val(null).trigger("change");
    });
  });

  // Handle search
  $("#job-search-form").on("submit", function (e) {
    e.preventDefault();
    const categories = $("#job-category").val() || [];
    const country = $("#country").val();
    const city = $("#city").val();
    const resultsDiv = $("#results");
    resultsDiv.empty();

    const filteredJobs = jobs.filter(job =>
      (categories.length === 0 || categories.includes(job.category)) &&
      (!country || job.country === country) &&
      (!city || job.city === city)
    );

    if (filteredJobs.length === 0) {
      resultsDiv.append("<p>No results found.</p>");
      $("#map").attr("src", "https://www.google.com/maps?q=World&output=embed");
      return;
    }

    filteredJobs.forEach(job => {
      const jobCard = `
        <div class="job-card">
          <h4><a href="job-details.html?title=${encodeURIComponent(job.title)}" target="_blank">${job.title}</a></h4>
          <p><strong>${job.city}, ${job.country}</strong></p>
          <p>Category: ${job.category}</p>
          <button class="btn btn-info btn-map" data-location="${job.city}, ${job.country}">View on Map</button>
        </div>
      `;
      resultsDiv.append(jobCard);
    });

    // Default map to first job
    const firstJob = filteredJobs[0];
    $("#map").attr("src", "https://www.google.com/maps?q=" + encodeURIComponent(firstJob.city + "," + firstJob.country) + "&output=embed");
  });

  // Handle "View on Map" button click
  $(document).on("click", ".btn-map", function () {
    const location = $(this).data("location");
    $("#map").attr("src", "https://www.google.com/maps?q=" + encodeURIComponent(location) + "&output=embed");
  });

  // Clear all button
  $("#clear-btn").on("click", function () {
    $("#results").empty();
    $("#map").attr("src", "https://www.google.com/maps?q=World&output=embed");
  });
</script>
</body>
</html>
