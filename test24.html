  <!-- Select2 -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

  <!-- Leaflet (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Inline CSS (keeps everything local to this file) -->
  <style>
    /* page base */
    body { background: #fff; color:#222; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; padding-top:15px; }
    .form-section { margin-top: 10px; }
    .results-section { margin-top: 10px; }
    .job-card { border: 1px solid #e0e0e0; padding: 12px; margin-bottom: 12px; border-radius: 4px; background: #fff; box-shadow: 0 0 0 rgba(0,0,0,0); }
    .job-card h4 { margin-top: 0; font-size: 16px; }
    #map { width: 100%; height: 420px; margin-top: 10px; border:1px solid #e6e6e6; border-radius:4px; }
    .btn-map { margin-top: 8px; }
    label { font-weight: 600; }
    .select2-container .select2-selection--multiple { min-height: 34px; }
    .small-clear { margin-top:6px; display:inline-block; }
    .placeholder-opt { color: #999; }
    .no-results { color:#888; padding: 10px 0; }
    /* ensure selects full width */
    .form-control, .select2-container { width:100% !important; }
    .results-count { margin-bottom: 10px; color:#555; }
    a.job-link { text-decoration: none; color: #337ab7; }
    a.job-link:hover { text-decoration: underline; }
    .footer-note { font-size:12px; color:#777; margin-top:6px; }
  </style>
</head>
<body>

<div class="container">

  <div class="row form-section">
    <!-- Form column -->
    <div class="col-sm-4">
      <h3>Filter Results</h3>

      <form id="job-search-form" autocomplete="off">
        <!-- Job Category (multi-select) -->
        <div class="form-group">
          <label for="job-category">Job Category</label>
          <select id="job-category" name="jobCategory[]" class="form-control" multiple="multiple">
            <option></option>
            <!-- Add many categories; user may click to select multiple -->
            <option>Business Services</option>
            <option>Finance</option>
            <option>Human Resources</option>
            <option>Information Technology</option>
            <option>Marketing</option>
            <option>Supply Chain</option>
            <option>Sales</option>
            <option>Legal</option>
            <option>Public Affairs</option>
            <option>Production & OPS</option>
            <option>Engineering</option>
            <option>Customer Service</option>
            <option>Analytics</option>
            <option>R&D</option>
            <option>Retail</option>
            <option>Internships</option>
            <option>Quality Assurance</option>
            <option>Logistics</option>
            <option>Procurement</option>
            <option>Design</option>
          </select>
          <!-- Clear button directly under the Job Category (beside other clear) -->
          <div>
            <button type="button" class="btn btn-default btn-xs small-clear" id="clear-job-category">Clear</button>
        <!-----    <span class="footer-note">Click items to select/deselect. No need to hold Ctrl.</span>-->
          </div>
        </div>

        <!-- Country (single select) -->
        <div class="form-group">
          <label for="country">Country</label>
          <select id="country" class="form-control">
            <option></option>
            <option>USA</option>
            <option>UK</option>
            <option>Mexico</option>
            <option>Singapore</option>
            <option>Ireland</option>
            <option>Costa Rica</option>
            <option>India</option>
            <option>Argentina</option>
            <option>Chile</option>
          </select>
        </div>

        <!-- City (single select, dynamically filled) -->
        <div class="form-group">
          <label for="city">City</label>
          <select id="city" class="form-control">
            <option></option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Search</button>
        <button type="button" class="btn btn-default btn-block" id="clear-btn">Clear All</button>
      </form>
    </div>

    <!-- Results column -->
    <div class="col-sm-8 results-section">
      <h3>Search Results</h3>
      <div id="results" aria-live="polite"></div>
    </div>
  </div>

  <!-- Map (full width row) -->
  <div class="row">
    <div class="col-sm-12">
      <div id="map" role="application" aria-label="Map showing job locations"></div>
    </div>
  </div>

</div>

<!-- JS libs -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

/* ---------------------------
   CATEGORY LIST (many options)
   --------------------------- */
const categories = [
  "Business Services","Finance","Human Resources","Information Technology",
  "Marketing","Supply Chain","Sales","Legal","Public Affairs","Production & OPS",
  "Engineering","Customer Service","Analytics","R&D","Retail","Internships",
  "Quality Assurance","Logistics","Procurement","Design"
];

/* ---------------------------
   Utilities
   --------------------------- */

// Deterministic hash -> simple number from string (for deterministic generation)
function strHashToNumber(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(h ^ s.charCodeAt(i), 16777619) >>> 0;
  }
  return h;
}

// Create deterministic job titles variations using category + city
function generateJobsFor(category, cityObj) {
  // produce between 2 and 3 jobs (deterministic)
  const seed = strHashToNumber(category + "|" + cityObj.name);
  const count = 2 + (seed % 2); // 2 or 3
  const seniorities = ["Junior", "Mid", "Senior", "Lead", "Associate", "Coordinator", "Specialist"];
  const modifiers = ["(Full-time)", "(Part-time)", "(Fixed-term)", "(Contract)", "(Remote eligible)"];

  const jobs = [];
  for (let i = 0; i < count; i++) {
    const idx1 = (seed + i * 13) % seniorities.length;
    const idx2 = (seed + i * 7) % modifiers.length;
    const title = `${category} - ${seniorities[idx1]} ${i+1} ${modifiers[idx2]}`;
    const company = ["Coca-Cola Co.", "Acme Corp", "GlobalTech", "BrightWorks"][ (seed + i) % 4 ];
    const id = 'job-' + (strHashToNumber(title + "|" + cityObj.name) >>> 0);
    jobs.push({
      id,
      title,
      company,
      category,
      city: cityObj.name,
      country: findCountryForCity(cityObj.name),
      lat: cityObj.lat,
      lng: cityObj.lng,
      posted: `${(seed % 28) + 1} days ago`
    });
  }
  return jobs;
}

function findCountryForCity(cityName) {
  for (const c in locationData) {
    if (locationData[c].some(z => z.name === cityName)) return c;
  }
  return "";
}

/* ---------------------------
   Initialize UI: Select2 & city population
   --------------------------- */
$(document).ready(function() {
  // initialize Select2 for job categories (multiple) and single selects for country & city
  $('#job-category').select2({
    placeholder: "Please Select...",
    allowClear: true,
    width: 'resolve'
  });

  $('#country').select2({
    placeholder: "Please Select...",
    allowClear: true,
    width: 'resolve'
  });

  $('#city').select2({
    placeholder: "Please Select...",
    allowClear: true,
    width: 'resolve'
  });

  // fill country options automatically (in case you add more in the dataset)
  // (We already added countries in HTML, but this keeps them in sync if changed)
  // populateCities when country changes:
  $('#country').on('change', function() {
    const country = $(this).val();
    const citySelect = $('#city');
    citySelect.empty().append('<option></option>');
    if (country && locationData[country]) {
      locationData[country].forEach(function(c) {
        citySelect.append(`<option value="${c.name}">${c.name}</option>`);
      });
    }
    // trigger select2 update
    citySelect.trigger('change.select2');
  });

  // clear only job categories button
  $('#clear-job-category').on('click', function() {
    $('#job-category').val(null).trigger('change');
  });

  // Clear All button
  $('#clear-btn').on('click', function() {
    $('#job-category').val(null).trigger('change');
    $('#country').val(null).trigger('change');
    $('#city').val(null).trigger('change');
    $('#results').empty();
    clearMapMarkers();
    map.setView([20,0], 2);
  });

  // initial map setup (center world)
  initMap();
});

/* ---------------------------
   MAP (Leaflet) Setup
   --------------------------- */
let map, markersLayer;

function initMap() {
  map = L.map('map', { preferCanvas: true }).setView([20, 0], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

function clearMapMarkers() {
  markersLayer.clearLayers();
}

/* ---------------------------
   SEARCH handling: generate jobs on-the-fly
   --------------------------- */
$('#job-search-form').on('submit', function(e) {
  e.preventDefault();

  // get filters
  const selectedCategories = $('#job-category').val() || []; // array or []
  const selectedCountry = $('#country').val(); // or null
  const selectedCity = $('#city').val(); // or null

  // determine cities to search: if specific city chosen -> just that city; else if country chosen -> all cities in that country; else -> all cities in all countries
  let citiesToSearch = [];
  if (selectedCity) {
    // find city object in dataset
    for (const c in locationData) {
      const found = locationData[c].find(x => x.name === selectedCity);
      if (found) { citiesToSearch.push(found); break; }
    }
  } else if (selectedCountry) {
    citiesToSearch = (locationData[selectedCountry] || []).slice();
  } else {
    // all cities across all countries
    for (const c in locationData) {
      citiesToSearch = citiesToSearch.concat(locationData[c]);
    }
  }

  // if no categories chosen, treat as "all categories"
  const categoriesToSearch = (selectedCategories.length === 0) ? categories : selectedCategories;

  // Now generate jobs: for each city × each category produce 2-3 job postings deterministically
  const results = [];
  citiesToSearch.forEach(cityObj => {
    categoriesToSearch.forEach(cat => {
      const generated = generateJobsFor(cat, cityObj);
      results.push(...generated);
    });
  });

  // Render results and map markers
  renderResults(results);
});

/* ---------------------------
   RENDER results & map markers
   --------------------------- */
function renderResults(jobList) {
  const resultsDiv = $('#results');
  resultsDiv.empty();

  if (!jobList || jobList.length === 0) {
    resultsDiv.append('<div class="no-results">No results found. Try choosing a country or city and category.</div>');
    clearMapMarkers();
    map.setView([20,0],2);
    return;
  }

  // show count
  resultsDiv.append(`<div class="results-count"><strong>${jobList.length}</strong> job(s) found</div>`);

  // show job cards
  jobList.forEach(job => {
    const card = $(`
      <div class="job-card" id="${job.id}">
        <h4><a class="job-link" href="job-details.html?title=${encodeURIComponent(job.title)}&city=${encodeURIComponent(job.city)}" target="_blank">${escapeHtml(job.title)}</a></h4>
        <div><strong>${escapeHtml(job.company)}</strong> &mdash; ${escapeHtml(job.city)}, ${escapeHtml(job.country)}</div>
        <div>Category: ${escapeHtml(job.category)} &nbsp; | &nbsp; Posted: ${escapeHtml(job.posted)}</div>
        <div>
          <button class="btn btn-info btn-xs btn-map" data-lat="${job.lat}" data-lng="${job.lng}" data-title="${escapeAttr(job.title)}">View on Map</button>
          <a class="btn btn-default btn-xs" href="job-details.html?id=${encodeURIComponent(job.id)}" target="_blank">View Details</a>
        </div>
      </div>
    `);
    resultsDiv.append(card);
  });

  // place markers for unique cities (one marker per city, cluster markers if many)
  clearMapMarkers();
  const markers = {};
  jobList.forEach(job => {
    const key = `${job.lat},${job.lng}`;
    if (!markers[key]) {
      const m = L.marker([job.lat, job.lng]).bindPopup(`<strong>${escapeHtml(job.city)}</strong><div>${escapeHtml(job.country)}</div>`);
      markersLayer.addLayer(m);
      markers[key] = m;
    }
  });

  // fit bounds to all markers or zoom to a single marker
  const allLatLngs = Object.keys(markers).map(k => {
    const [lat,lng] = k.split(',').map(Number);
    return [lat,lng];
  });
  if (allLatLngs.length === 1) {
    map.setView(allLatLngs[0], 10);
    markersLayer.eachLayer(layer => layer.openPopup && layer.openPopup());
  } else if (allLatLngs.length > 1) {
    const bounds = L.latLngBounds(allLatLngs);
    map.fitBounds(bounds.pad(0.2));
  } else {
    map.setView([20,0],2);
  }
}

/* ---------------------------
   Handle View on Map button (centers map on job location)
   --------------------------- */
$(document).on('click', '.btn-map', function() {
  const lat = Number($(this).attr('data-lat'));
  const lng = Number($(this).attr('data-lng'));
  const title = $(this).attr('data-title') || '';
  if (!isFinite(lat) || !isFinite(lng)) return;
  map.setView([lat,lng], 12);
  // add a temporary bounce marker (popup)
  const temp = L.marker([lat,lng]).addTo(map);
  temp.bindPopup(`<strong>${escapeHtml(title)}</strong>`).openPopup();
  // remove after short delay
  setTimeout(() => {
    map.removeLayer(temp);
  }, 3500);
});

/* ---------------------------
   Small safety helpers
   --------------------------- */
function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/[&<>"'\/]/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#47;'}[c];
  });
}
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

</script>
